<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>集保 PDF 辨識測試 - JazzerLife Finance</title>
  <link rel="icon" href="../assets/image/jazzerlife_logo.png" type="image/png" />
  <style>
    :root {
      --bg: #0d0d0f;
      --panel: #17171b;
      --border: #2c2c33;
      --text: #e8e8ea;
      --muted: #9a9aa4;
      --accent: #4da3ff;
      --warn: #ffb545;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 15px;
    }

    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .sub a { color: var(--accent); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

    input[type="file"], input[type="password"] {
      width: 100%;
      padding: 10px;
      background: #101014;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      margin-bottom: 12px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #06121f;
      font-weight: 700;
      cursor: pointer;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .stats b { color: var(--text); }

    .msg { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
    .msg.warn { background: rgba(255, 181, 69, .12); border: 1px solid var(--warn); color: var(--warn); }
    .msg.error { background: rgba(255, 107, 107, .12); border: 1px solid var(--danger); color: var(--danger); }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: rgba(77, 163, 255, .06); }

    .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
    .tag.guess { color: var(--warn); border-color: var(--warn); }

    pre {
      background: #101014;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      max-height: 480px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .hidden { display: none; }
  </style>
</head>

<body>
  <h1>📄 集保 PDF 辨識測試</h1>
  <div class="sub">
    上傳台股集保／券商庫存 PDF，檢視辨識結果。<b>此頁只做辨識，不會寫入資料庫。</b>
    · <a href="finance.html">← 回 Finance</a>
  </div>

  <div class="panel">
    <label for="pdfFile">PDF 檔案（單檔，10MB 以內）</label>
    <input type="file" id="pdfFile" accept="application/pdf,.pdf" />

    <label for="pdfPassword">開啟密碼（沒有加密就留空）</label>
    <input type="password" id="pdfPassword" placeholder="例如身分證字號、出生年月日" autocomplete="off" />

    <div class="row">
      <button id="btnParse">開始辨識</button>
      <button class="ghost" id="btnCopyRaw" disabled>複製原始文字</button>
      <span id="status" style="color:var(--muted);font-size:13px;"></span>
    </div>
  </div>

  <div id="messages"></div>

  <div class="panel hidden" id="resultPanel">
    <div class="stats" id="stats"></div>
    <div class="table-wrap">
      <table id="rowsTable">
        <thead>
          <tr>
            <th>頁</th>
            <th>代號</th>
            <th>名稱</th>
            <th class="num">股數</th>
            <th class="num">單價</th>
            <th class="num">市值</th>
            <th class="num">成本</th>
            <th>來源</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="panel hidden" id="rawPanel">
    <div class="row" style="justify-content:space-between;margin-bottom:8px;">
      <b style="font-size:14px;">PDF 原始文字（依行）</b>
      <button class="ghost" id="btnToggleRaw">收合</button>
    </div>
    <div class="sub" style="margin:0 0 8px;">辨識結果不如預期時，把這段複製給開發者調整解析規則。</div>
    <pre id="rawText"></pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let lastRaw = '';

    function showMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = text;
      $('messages').appendChild(div);
    }

    function fmt(v) {
      if (v === null || v === undefined) return '';
      // 股數可能是整數、價格可能有小數，統一交給 toLocaleString 但不強制小數位
      return Number(v).toLocaleString('zh-TW', { maximumFractionDigits: 4 });
    }

    async function parsePdf() {
      const file = $('pdfFile').files[0];
      if (!file) { showMessage('請先選擇 PDF 檔案', 'error'); return; }

      $('messages').innerHTML = '';
      $('resultPanel').classList.add('hidden');
      $('rawPanel').classList.add('hidden');
      $('btnParse').disabled = true;
      $('status').textContent = '辨識中…';

      const fd = new FormData();
      fd.append('file', file);
      fd.append('password', $('pdfPassword').value);

      try {
        const res = await fetch('/api/finance/stock-pdf/preview', {
          method: 'POST',
          body: fd,
          credentials: 'same-origin'
        });

        if (res.status === 401) {
          showMessage('尚未登入或登入已過期，請重新登入後再試。', 'error');
          setTimeout(() => location.href = '/signin.html', 1500);
          return;
        }

        const data = await res.json();
        if (!res.ok) {
          showMessage((data.message || '辨識失敗') + (data.detail ? '（' + data.detail + '）' : ''), 'error');
          return;
        }

        render(data);
      } catch (err) {
        showMessage('呼叫 API 失敗：' + err.message, 'error');
      } finally {
        $('btnParse').disabled = false;
        $('status').textContent = '';
      }
    }

    function render(data) {
      (data.Warnings || []).forEach(w => showMessage('⚠ ' + w, 'warn'));

      $('stats').innerHTML = [
        ['檔名', data.FileName],
        ['頁數', data.PageCount],
        ['文字量', data.TextCharCount + ' 字'],
        ['辨識筆數', (data.Rows || []).length + ' 筆'],
        ['總股數', fmt((data.Rows || []).reduce((s, r) => s + (r.Unit || 0), 0))]
      ].map(([k, v]) => `<span>${k}：<b>${v}</b></span>`).join('');

      const tbody = $('rowsTable').querySelector('tbody');
      tbody.innerHTML = (data.Rows || []).map(r => `
        <tr title="${(r.RawLine || '').replace(/"/g, '&quot;')}">
          <td>${r.PageNumber}</td>
          <td>${r.Code}</td>
          <td>${r.Name}</td>
          <td class="num">${fmt(r.Unit)}</td>
          <td class="num">${fmt(r.Price)}</td>
          <td class="num">${fmt(r.MarketValue)}</td>
          <td class="num">${fmt(r.Cost)}</td>
          <td><span class="tag ${r.Source === 'guess' ? 'guess' : ''}">${r.Source === 'guess' ? '推測' : '對欄'}</span></td>
        </tr>`).join('');
      $('resultPanel').classList.remove('hidden');

      lastRaw = (data.Lines || []).map(l => `[P${l.PageNumber}] ${l.Text}`).join('\n');
      $('rawText').textContent = lastRaw;
      $('rawPanel').classList.remove('hidden');
      $('btnCopyRaw').disabled = !lastRaw;
    }

    $('btnParse').addEventListener('click', parsePdf);

    $('btnCopyRaw').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(lastRaw);
        $('status').textContent = '已複製';
      } catch {
        // 非 HTTPS 或瀏覽器不支援剪貼簿 API 時，退回全選讓使用者手動複製
        const range = document.createRange();
        range.selectNodeContents($('rawText'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        $('status').textContent = '請按 Ctrl+C 複製';
      }
      setTimeout(() => $('status').textContent = '', 2000);
    });

    $('btnToggleRaw').addEventListener('click', () => {
      const pre = $('rawText');
      const hidden = pre.style.display === 'none';
      pre.style.display = hidden ? '' : 'none';
      $('btnToggleRaw').textContent = hidden ? '收合' : '展開';
    });
  </script>
</body>

</html>
